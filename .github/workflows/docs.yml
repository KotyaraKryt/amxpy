# Сайт документации на GitHub Pages: https://kotyarakryt.github.io/amxpy/
# Собирается из main; справочник, каталог событий и диагностики генерируются из кода (scripts/mkdocs_hooks.py).
name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: сборка сайта
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Установка amxpy с документацией
        run: pip install -e '.[docs]'

      - name: mkdocs build --strict
        env:
          NO_MKDOCS_2_WARNING: "1"
        run: mkdocs build --strict

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: публикация
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
