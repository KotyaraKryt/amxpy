site_name: amxpy
site_description: Плагины AMX Mod X на Python — события, команды, меню, горячая перезагрузка и связь с Pawn
copyright: amxpy · GPL-3.0-or-later · AMX Mod X, ReHLDS и ReGameDLL принадлежат их авторам
site_url: https://kotyarakryt.github.io/amxpy/
repo_url: https://github.com/KotyaraKryt/amxpy
repo_name: KotyaraKryt/amxpy
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site
exclude_docs: |
  releases.yml

theme:
  name: material
  custom_dir: overrides
  language: ru
  font: false
  favicon: assets/logo.svg
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - toc.follow

extra_css:
  - assets/stylesheets/amxpy.css

hooks:
  - scripts/mkdocs_hooks.py

plugins:
  - search:
      lang: [ru, en]
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: null
            show_root_heading: true
            show_root_full_path: false
            show_source: false
            show_bases: false
            show_labels: false
            members_order: source
            heading_level: 2
            merge_init_into_class: true
            separate_signature: true
            show_signature_annotations: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            filters: ["!^_"]
            line_length: 88

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - def_list
  - toc:
      permalink: "#"
      toc_depth: 3
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets:
      base_path: [examples/plugins]
      check_paths: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Главная: index.md
  - Документация:
      - Начало:
          - Установка: start/install.md
          - Первый плагин: start/first-plugin.md
          - Проект и деплой: start/project.md
          - VS Code: start/vscode.md
      - Руководство:
          - Плагин и модули: guide/plugin.md
          - События: guide/events.md
          - Команды: guide/commands.md
          - Игроки и сервер: guide/players.md
          - Меню, HUD и чат: guide/ui.md
          - Настройки и cvar'ы: guide/config.md
          - Async и задачи: guide/async.md
          - Хранилище и переводы: guide/data.md
          - Горячая перезагрузка: guide/hot-reload.md
          - Тестирование: guide/testing.md
      - Pawn и AMXX:
          - Нативы AMXX из Python: pawn/amxx-call.md
          - Форварды Pawn в Python: pawn/forwards.md
          - API для Pawn-плагинов: pawn/api.md
  - Справочник:
      - reference/index.md
      - Plugin и Router: reference/plugin.md
      - События: reference/events.md
      - Игроки: reference/player.md
      - Меню, HUD, сообщения: reference/ui.md
      - Настройки и сервер: reference/config.md
      - amxx: reference/amxx.md
      - Хранилище: reference/storage.md
      - Тестирование: reference/testing.md
      - Команды amxpy: reference/cli.md
      - Диагностики amxpyc: reference/diagnostics.md
  - Примеры:
      - examples/index.md
      - Привет и /hp: examples/hello.md
      - Запрет AWP: examples/no-awp.md
      - MVP раунда: examples/round-mvp.md
      - С возвращением: examples/welcome-back.md
      - Меню и HUD: examples/ui-demo.md
      - VIP-система: examples/vip.md
  - Что нового: changelog.md
